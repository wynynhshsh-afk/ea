:root{
  --ink:#070b1a; --ink2:#0d1430; --glass:rgba(18,26,58,.62); --line:rgba(150,180,255,.16);
  --c1:#5ef2ff; --c2:#8b6cff; --ok:#3df5a6; --warn:#ffb83d; --bad:#ff5d73; --tx:#e9efff; --mut:#8a98c4;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;-webkit-user-select:none;user-select:none;overscroll-behavior:none;background:var(--ink);color:var(--tx);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif}
body{background:radial-gradient(120% 80% at 50% -10%,#1b2a6b 0%,#0c1334 45%,#050816 100%) fixed;overflow-x:hidden;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{padding:.55rem .9rem;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:inline-flex;align-items:center;gap:.4rem;transition:transform .18s,border-color .18s,box-shadow .18s;white-space:nowrap}
.btn:hover{border-color:var(--c1);box-shadow:0 0 22px -6px var(--c1);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.btn.pri{background:linear-gradient(135deg,var(--c2),#3b82ff 60%,var(--c1));border-color:transparent;font-weight:700;box-shadow:0 8px 28px -10px var(--c2)}
.btn.on{border-color:var(--c1);box-shadow:0 0 20px -6px var(--c1) inset,0 0 20px -6px var(--c1)}
.btn[disabled]{opacity:.35;pointer-events:none}
#splash{position:fixed;inset:0;z-index:99;background:#050816;display:grid;place-items:center;transition:opacity .9s ease,visibility .9s;perspective:900px}
#splash.out{opacity:0;visibility:hidden}
.cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:spin 3.2s cubic-bezier(.6,0,.2,1) infinite}
.cube i{position:absolute;inset:0;border:2px solid var(--c1);background:rgba(94,242,255,.06);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:46px;color:var(--c1);text-shadow:0 0 22px var(--c1);box-shadow:0 0 30px -8px var(--c2) inset}
.cube i:nth-child(1){transform:translateZ(60px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(60px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(60px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
@keyframes spin{0%{transform:rotateX(-20deg) rotateY(0)}100%{transform:rotateX(-20deg) rotateY(360deg)}}
#splash p{position:absolute;bottom:18%;margin:0;color:var(--mut);letter-spacing:.08em}
header{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.8rem 1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem}
.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;background:linear-gradient(145deg,#1d2a66,#0b1130);border:1px solid var(--line);color:var(--c1);text-shadow:0 0 14px var(--c1);transform:perspective(200px) rotateY(-18deg) rotateX(8deg);box-shadow:8px 10px 24px -8px #000,0 0 20px -8px var(--c1)}
.brand b{font-size:1.25rem;font-weight:900;display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:.72rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}
.warn{margin:0 1rem .4rem;padding:.7rem .9rem;border-radius:14px;border:1px solid rgba(255,184,61,.45);background:rgba(255,184,61,.09);color:#ffd9a0;font-size:.85rem;line-height:1.7}
main{display:grid;gap:1rem;padding:0 1rem 1rem;grid-template-columns:1fr}
@media(min-width:960px){main{grid-template-columns:1.35fr 1fr;align-items:start}}
#stage{position:relative;height:clamp(320px,52vh,620px);border-radius:28px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(70% 70% at 50% 40%,rgba(94,242,255,.10),transparent 70%),linear-gradient(180deg,rgba(13,20,48,.5),rgba(5,8,22,.2));touch-action:pan-y}
@media(min-width:960px){#stage{height:calc(100vh - 230px);min-height:480px}}
#gl{width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:900;line-height:1;text-shadow:0 2px 16px #000;transition:opacity .4s}
.lbl .v{font-size:1.45rem;display:block;direction:ltr}
.lbl .k{font-size:.68rem;color:var(--mut);font-weight:500;display:block;margin-top:.25rem}
.lbl.big .v{font-size:2.5rem}
.lbl.chg .v::after{content:' ⚡';font-size:.8em}
#hint{position:absolute;bottom:.7rem;inset-inline:0;text-align:center;color:var(--mut);font-size:.72rem;pointer-events:none}
#panel{display:grid;gap:.8rem}
.box{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:1rem;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dev-h{display:flex;align-items:center;gap:.8rem}
.dev-ic{font-size:2rem;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#1d2a66,#0b1130);border:1px solid var(--line)}
.dev-h h2{margin:0;font-size:1.2rem;font-weight:700}
.dev-h small{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;padding:.2rem .6rem;border-radius:99px;border:1px solid var(--line);margin-top:.3rem}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--mut)}
.pill.ok::before{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.pill.off::before{background:var(--bad)}
.pill.demo::before{background:var(--c2);box-shadow:0 0 10px var(--c2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.tile{border-radius:18px;padding:.8rem .5rem;text-align:center;border:1px solid var(--line);background:rgba(8,12,34,.55);transform-style:preserve-3d;transition:transform .25s}
.tile:hover{transform:perspective(500px) rotateX(6deg) translateY(-3px)}
.tile .n{font-size:1.7rem;font-weight:900;direction:ltr}
.tile .t{font-size:.72rem;color:var(--mut)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.stat{padding:.55rem .7rem;border-radius:14px;background:rgba(8,12,34,.45);font-size:.8rem}
.stat span{display:block;color:var(--mut);font-size:.7rem}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:middle;margin-inline-start:.3rem}
.sig i{width:4px;background:var(--line);border-radius:2px}.sig i.a{background:var(--c1)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:.5rem}
.acts .btn{justify-content:center;font-size:.82rem}
.note{font-size:.78rem;color:var(--mut);line-height:1.8;margin-top:.5rem}
canvas#spark{width:100%;height:84px;display:block}
nav#cards{display:flex;gap:.7rem;overflow-x:auto;padding:.4rem 1rem 1.4rem;perspective:900px;scrollbar-width:none}
nav#cards::-webkit-scrollbar{display:none}
.card{flex:0 0 150px;padding:.8rem;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-align:center;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;transform:rotateY(0)}
.card:hover{transform:rotateY(-10deg) translateY(-6px)}
.card.act{border-color:var(--c1);box-shadow:0 0 28px -8px var(--c1);transform:translateY(-6px) scale(1.04)}
.card .ic{font-size:1.9rem}.card b{display:block;font-size:.82rem;margin:.3rem 0 .15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mut);direction:ltr;display:block}
.card.add{display:grid;place-items:center;border-style:dashed;color:var(--c1);font-size:1.7rem}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,5,16,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:1rem}
.modal[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:86vh;overflow:auto;background:#0e1636;border:1px solid var(--line);border-radius:26px;padding:1.2rem;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:perspective(700px) rotateX(18deg) translateY(30px) scale(.94);opacity:0}}
.sheet h3{margin:0 0 .8rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.sw{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--c2)}.sw.on::after{transform:translateX(-20px)}
[dir=ltr] .sw.on::after{transform:translateX(20px)}
input[type=range]{accent-color:var(--c1);width:150px}
#toasts{position:fixed;bottom:calc(14px + var(--safe-b));inset-inline:0;display:grid;justify-items:center;gap:.5rem;z-index:70;pointer-events:none}
.toast{background:#121b44;border:1px solid var(--c1);padding:.6rem 1rem;border-radius:14px;font-size:.85rem;animation:tin .4s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 10px 30px -10px #000;max-width:92vw}
@keyframes tin{from{transform:translateY(24px) scale(.9);opacity:0}}
.help p{line-height:1.9;font-size:.86rem;color:#c9d4f5;margin:.4rem 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div id="splash"><div class="cube"><i>E</i><i>A</i><i>E</i><i>A</i><i>E</i><i>A</i></div><p>EA · Audio Manager</p></div>

  /* stars */
  const sg=new THREE.BufferGeometry(),sp=new Float32Array(700*3);
  for(let i=0;i<700;i++){const r=9+Math.random()*14,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);sp[i*3]=r*Math.sin(b)*Math.cos(a);sp[i*3+1]=r*Math.cos(b);sp[i*3+2]=r*Math.sin(b)*Math.sin(a)-6}
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0x9fc2ff,size:.07,transparent:true,opacity:.8,depthWrite:false}));scene.add(stars);
  /* halo rings (decor) */
  const halo=new THREE.Group();
  [3.1,3.5].forEach((r,i)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,128),new THREE.MeshBasicMaterial({color:i?0x8b6cff:0x5ef2ff,transparent:true,opacity:.45}));m.rotation.x=1.25+i*.25;halo.add(m)});
  scene.add(halo);
  const root=new THREE.Group(),hud=new THREE.Group();scene.add(root,hud);
  const orbiter=new THREE.Mesh(new THREE.SphereGeometry(.14,24,24),new THREE.MeshBasicMaterial({color:0xffffff}));orbiter.visible=false;scene.add(orbiter);
  const orbit={on:false,ang:0};
  const st={dev:null,parts:{},rings:{},cur:{},tgt:{},chg:{},lbl:{},appear:0,yaw:0,vel:0,drag:false,px:0,tiltX:0,tiltY:0,pulse:{l:0,r:0},type:'idle'};
  const mats={white:new THREE.MeshPhysicalMaterial({color:0xf3f6ff,roughness:.22,metalness:.08,clearcoat:1,clearcoatRoughness:.08}),
    dark:new THREE.MeshStandardMaterial({color:0x141a33,roughness:.5,metalness:.4}),
    metal:new THREE.MeshStandardMaterial({color:0x9aa6d6,roughness:.25,metalness:.9})};
  function ring(r){
    const g=new THREE.Group();
    const tr=new THREE.Mesh(new THREE.TorusGeometry(r,.035,10,96),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.14}));
    const fl=new THREE.Mesh(new THREE.TorusGeometry(r,.065,12,96,.02),new THREE.MeshBasicMaterial({color:0x3df5a6,side:THREE.DoubleSide}));
    fl.rotation.z=Math.PI/2;fl.scale.x=-1;g.add(tr,fl);g.userData={fl,r,shown:-1};return g}
  function setRing(g,pct,col){const u=g.userData;u.fl.material.color.set(col);
    if(Math.abs(pct-u.shown)>.4){u.shown=pct;u.fl.geometry.dispose();u.fl.geometry=new THREE.TorusGeometry(u.r,.065,12,96,Math.max(.02,pct/100*Math.PI*2))}}
  function bud(side){
    const g=new THREE.Group();
    const head=new THREE.Mesh(new THREE.SphereGeometry(.46,48,32),mats.white);head.scale.set(1,1.05,.92);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.14,.1,1.05,32),mats.white);stem.position.y=-.68;
    const tip=new THREE.Mesh(new THREE.SphereGeometry(.1,16,16),mats.white);tip.position.y=-1.2;
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.06,24),mats.dark);mesh.rotation.z=Math.PI/2;mesh.position.set(-side*.42,.02,.05);
    const led=new THREE.Mesh(new THREE.SphereGeometry(.055,16,16),new THREE.MeshBasicMaterial({color:0x3df5a6}));led.position.set(side*.2,-.28,.4);
    const sens=new THREE.Mesh(new THREE.SphereGeometry(.05,12,12),mats.metal);sens.position.set(side*.1,-.95,.1);
    g.add(head,stem,tip,mesh,led,sens);g.userData.led=led;g.rotation.z=side*.2;g.rotation.y=-side*.35;return g}
  function caseMesh(){
    const g=new THREE.Group();
    const base=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,.6,56),mats.white);base.scale.z=.62;base.position.y=-.2;
    const lid=new THREE.Mesh(new THREE.SphereGeometry(.9,56,24,0,Math.PI*2,0,Math.PI/2),mats.white);lid.scale.set(1,.55,.62);lid.position.y=.1;
    const seam=new THREE.Mesh(new THREE.TorusGeometry(.9,.012,8,64),mats.metal);seam.rotation.x=Math.PI/2;seam.scale.y=.62;seam.position.y=.1;
    const led=new THREE.Mesh(new THREE.SphereGeometry(.045,12,12),new THREE.MeshBasicMaterial({color:0x3df5a6}));led.position.set(0,-.2,.57);
    g.add(base,lid,seam,led);g.userData.led=led;return g}
  function phones(){
    const g=new THREE.Group();
    const band=new THREE.Mesh(new THREE.TorusGeometry(1.05,.09,16,64,Math.PI),mats.dark);g.add(band);
    const slide=new THREE.Mesh(new THREE.TorusGeometry(1.05,.11,12,32,Math.PI*.35),mats.metal);slide.rotation.z=Math.PI*.325;g.add(slide);
    [-1,1].forEach(s=>{
      const cup=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.38,48),mats.dark);cup.rotation.z=Math.PI/2;cup.position.set(s*1.05,-.1,0);
      const pad=new THREE.Mesh(new THREE.TorusGeometry(.48,.17,16,48),mats.white);pad.rotation.y=Math.PI/2;pad.position.set(s*.82,-.1,0);
      const cap=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.03,40),mats.metal);cap.rotation.z=Math.PI/2;cap.position.set(s*1.25,-.1,0);
      g.add(cup,pad,cap)});
    g.position.y=.1;return g}
  function speaker(){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,2.1,56),mats.dark);body.rotation.z=Math.PI/2;
    [-1,1].forEach(s=>{const cap=new THREE.Mesh(new THREE.CircleGeometry(.85,48),new THREE.MeshStandardMaterial({color:0x1b2552,metalness:.6,roughness:.4}));cap.position.x=s*1.06;cap.rotation.y=s*Math.PI/2;g.add(cap)});
    const grill=new THREE.Mesh(new THREE.CylinderGeometry(.87,.87,1.4,56,1,true),new THREE.MeshStandardMaterial({color:0x2c3a7a,wireframe:true,emissive:0x5ef2ff,emissiveIntensity:.15}));grill.rotation.z=Math.PI/2;
    const cone=new THREE.Mesh(new THREE.TorusGeometry(.55,.05,10,48),mats.metal);cone.position.set(0,0,.86);
    g.add(body,grill,cone);g.userData.cone=cone;g.rotation.y=-.5;return g}
  function orb(){
    const g=new THREE.Group();
    const w=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1),new THREE.MeshBasicMaterial({color:0x5ef2ff,wireframe:true,transparent:true,opacity:.55}));
    const c=new THREE.Mesh(new THREE.SphereGeometry(.5,32,32),new THREE.MeshBasicMaterial({color:0x8b6cff,transparent:true,opacity:.7}));
    g.add(w,c);g.userData.w=w;g.userData.core=c;return g}
  function clearAll(){
    while(root.children.length)root.remove(root.children[0]);
    while(hud.children.length)hud.remove(hud.children[0]);
    labels.innerHTML='';st.parts={};st.rings={};st.lbl={};st.cur={};st.tgt={}}
  function addLabel(key,big){const e=document.createElement('div');e.className='lbl'+(big?' big':'');e.innerHTML='<span class="v">—</span><span class="k"></span>';labels.appendChild(e);st.lbl[key]=e;return e}
  function build(d){
    clearAll();st.dev=d||null;st.appear=0;st.type=d?d.type:'idle';
    if(!d){const o=orb();root.add(o);st.parts.orb=o;fit();return}
    if(d.type==='buds'){
      const L=bud(-1),Rr=bud(1),K=caseMesh();L.position.set(-1.05,.75,0);Rr.position.set(1.05,.75,0);K.position.set(0,-1.85,0);K.rotation.x=.15;
      root.add(L,Rr,K);st.parts={l:L,r:Rr,k:K};
      [['l',.82,'left'],['r',.82,'right'],['k',.82,'case']].forEach(([k,r,n])=>{const g=ring(r);hud.add(g);st.rings[k]=g;addLabel(k).querySelector('.k').textContent=t(n)});
    }else{
      const m=d.type==='phones'?phones():d.type==='speaker'?speaker():orb();root.add(m);st.parts.c=m;
      const g=ring(1.95);hud.add(g);st.rings.c=g;addLabel('c',true).querySelector('.k').textContent=label(d)}
    fit()}
  function fit(){
    const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
    R.setSize(w,h,false);cam.aspect=w/h;
    const halfW=st.type==='buds'?2.15:2.5,halfH=st.type==='buds'?3.1:2.6;
    const tan=Math.tan(cam.fov*Math.PI/360);
    cam.position.z=Math.max(halfW/(cam.aspect*tan),halfH/tan)+.2;cam.position.y=0;cam.updateProjectionMatrix()}
  new ResizeObserver(fit).observe(stage);
  /* interaction */
  let lx=0;
  stage.addEventListener('pointerdown',e=>{st.drag=true;lx=e.clientX;st.vel=0;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(st.drag){const dx=e.clientX-lx;lx=e.clientX;st.yaw+=dx*.008;st.vel=dx*.008}
    const r=stage.getBoundingClientRect();st.tiltY=((e.clientX-r.left)/r.width-.5)*.5;st.tiltX=((e.clientY-r.top)/r.height-.5)*.4});
  stage.addEventListener('pointerup',()=>{st.drag=false});
  stage.addEventListener('pointercancel',()=>{st.drag=false});
  addEventListener('deviceorientation',e=>{if(e.gamma==null||st.drag)return;st.tiltY=clamp(e.gamma/60,-.4,.4)*.8;st.tiltX=clamp((e.beta-50)/80,-.4,.4)*.6},{passive:true});
  const V=new THREE.Vector3(),clock=new THREE.Clock();
  function sync(d){
    if(!d||d!==st.dev){return}
    if(d.type!==st.type){build(d)}
    const keys=d.type==='buds'?['l','r','k']:['c'];
    keys.forEach(k=>{st.tgt[k]=d.bat[k];st.chg[k]=d.chg[k]});
    if(st.lbl.c)st.lbl.c.querySelector('.k').textContent=label(d)}
  function pulseBud(k){st.pulse[k]=1}
  function frame(){
    requestAnimationFrame(frame);
    const dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
    st.appear=Math.min(1,st.appear+dt*1.6);const ease=1-Math.pow(1-st.appear,3);
    if(!st.drag){st.yaw+=st.vel;st.vel*=.94;if(S.cfg.rotate)st.yaw+=.004;else st.yaw*=.97}
    root.rotation.y=st.yaw*(st.type==='speaker'||st.type==='phones'?1:.55);
    root.rotation.x+=((st.tiltX*.6)-root.rotation.x)*.06;
    root.position.y=.15+Math.sin(T*1.1)*.07;
    root.scale.setScalar(.2+.8*ease);
    cam.position.x+=((st.tiltY*1.2)-cam.position.x)*.05;cam.lookAt(0,0,0);
    stars.rotation.y+=dt*.01;halo.rotation.z+=dt*.15;halo.rotation.y+=dt*.05;
    const o=st.parts.orb;if(o){o.userData.w.rotation.y+=dt*.6;o.userData.w.rotation.x+=dt*.3;const s=1+Math.sin(T*2.2)*.12;o.userData.core.scale.setScalar(s)}
    const c=st.parts.c;if(c&&c.userData.w){c.userData.w.rotation.y+=dt*.6;c.userData.core.scale.setScalar(1+Math.sin(T*2.2)*.12)}
    if(c&&c.userData.cone&&orbit.on)c.userData.cone.scale.setScalar(1+Math.abs(Math.sin(T*9))*.08);
    ['l','r'].forEach(k=>{if(st.pulse[k]>0){st.pulse[k]=Math.max(0,st.pulse[k]-dt*1.3);const b=st.parts[k];if(b)b.scale.setScalar(1+Math.sin(st.pulse[k]*20)*.08*st.pulse[k])}});
    /* rings, leds, labels */
    const w=stage.clientWidth,h=stage.clientHeight;
    for(const k in st.rings){
      const tg=st.tgt[k],has=tg!=null,cur=st.cur[k]??0;
      st.cur[k]=cur+((has?tg:0)-cur)*Math.min(1,dt*3.5);
      const chg=!!st.chg[k],col=levelColor(has?tg:null,chg),pulse=chg?.6+.4*Math.sin(T*5):(has&&tg<=15?.55+.45*Math.sin(T*6):1);
      const g=st.rings[k];setRing(g,st.cur[k],col);g.userData.fl.material.opacity=1;g.userData.fl.material.transparent=true;g.userData.fl.material.opacity=pulse;
      const obj=st.parts[k];if(!obj)continue;
      obj.getWorldPosition(V);g.position.copy(V);if(k==='k')g.position.y+=.05;if(k==='l'||k==='r')g.position.y-=.25;g.quaternion.copy(cam.quaternion);g.scale.setScalar(.2+.8*ease);
      if(obj.userData.led){obj.userData.led.material.color.set(col);obj.userData.led.scale.setScalar(chg?1+.5*Math.sin(T*6):1)}
      const lb=st.lbl[k];if(lb){V.copy(g.position);V.project(cam);lb.style.left=((V.x*.5+.5)*w)+'px';lb.style.top=((-V.y*.5+.5)*h)+'px';
        lb.querySelector('.v').textContent=has?Math.round(st.cur[k])+'%':'—';lb.querySelector('.v').style.color=col;lb.classList.toggle('chg',chg);lb.style.opacity=ease}}
    /* orbiter for spatial audio */
    orbiter.visible=orbit.on;if(orbit.on){orbiter.position.set(Math.sin(orbit.ang)*2.9,.3,Math.cos(orbit.ang)*2.9-1);const s=1+Math.sin(T*10)*.25;orbiter.scale.setScalar(s)}
    R.render(scene,cam)}
  frame();
  return{build,sync,orbit,pulse:pulseBud}
})();
function pulseBud(k){if(G.pulse)G.pulse(k)}

/* ============ wiring ============ */
function syncSettings(){
  $('#sLow').value=S.cfg.low;$('#sLowV').textContent=S.cfg.low;
  [['sNot','notify'],['sVib','vibrate'],['sRot','rotate'],['sAuto','auto']].forEach(([i,k])=>$('#'+i).classList.toggle('on',!!S.cfg[k]))}
$('#bAdd').onclick=addDevice;$('#bLive').onclick=liveScan;$('#bDemo').onclick=loadDemo;
$('#bSet').onclick=()=>{$('#mSet').hidden=false};$('#bHelp').onclick=()=>{$('#mHelp').hidden=false};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').hidden=true);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.hidden=true}));
$('#bLang').onclick=()=>{S.cfg.lang=S.cfg.lang==='fa'?'en':'fa';saveCfg();applyLang();G.build(devs.get(activeId));refresh()};
$('#sLow').oninput=e=>{S.cfg.low=+e.target.value;$('#sLowV').textContent=S.cfg.low;saveCfg()};
[['sNot','notify'],['sVib','vibrate'],['sRot','rotate'],['sAuto','auto']].forEach(([i,k])=>$('#'+i).onclick=async()=>{
  S.cfg[k]=!S.cfg[k];
  if(k==='notify'&&S.cfg.notify&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  saveCfg();syncSettings()});
addEventListener('resize',spark);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function init(){
  applyLang();
  if(!BT){const w=$('#warn');w.hidden=false;w.textContent=t('unsup')}
  setTimeout(()=>$('#splash').classList.add('out'),1900);
  G.build(null);refresh();autoDetect();
})();
</script>
